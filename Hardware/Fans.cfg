#####################################################################
#   Fan Control
#####################################################################

[fan]
##  Print Cooling Fan - FAN0
# pin: nhk:gpio6
# tachometer_pin: nhk:gpio17
# tachometer_ppr: 2
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
min_power: 0.10

[heater_fan hotend_fan]
##  Hotend Fan - FAN1
# pin: nhk:gpio5
# tachometer_pin: nhk:gpio16
# tachometer_ppr: 2
max_power: 1.0
kick_start_time: 0.5
tachometer_ppr: 2
tachometer_poll_interval: 0.0005
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

# [temperature_fan MCU]
# ##  Controller fan - FAN2
# pin: PF7
# kick_start_time: 0.500
# sensor_type: temperature_mcu
# control: watermark
# target_temp: 55.0
# max_delta: 3
# min_temp: 0
# max_temp: 110
# max_speed: 1.0
# min_speed: 0.25
# kick_start_time: 0.500

# [temperature_fan Pi]
# ##  Controller fan - FAN2
# pin: PF7
# kick_start_time: 0.500
# sensor_type: temperature_host
# control: watermark
# target_temp: 55.0
# max_delta: 3
# min_temp: 0
# max_temp: 110
# max_speed: 1.0
# min_speed: 0.25
# kick_start_time: 0.500

[temperature_fan Pi]
pin: PF7
sensor_type: temperature_host
cycle_time: 0.010
shutdown_speed: 1.0
min_temp: 0
max_temp: 80
#Target_temp is where it will use 100% fan speed
target_temp: 70
min_speed: 0.15
control: curve
points:
    45, 0.15
    70, 1.0

[fan_generic nevermore]
##  Exhaust fan - FAN3
pin: PF9
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.500
min_power: 0.10

[heater_generic chamber]
heater_pin: PB3
# sensor_type: <Generic 3950 or your thermistor type>
# sensor_pin: <The pin your thermistor is connected to>
sensor_type: temperature_combined
sensor_list: temperature_sensor chamber_top, temperature_sensor chamber_bottom
#   Must be provided. List of sensors to combine to new "virtual"
#   sensor.
#   E.g. 'temperature_sensor sensor1,extruder,heater_bed'
combination_method: mean
#   Must be provided. Combination method used for the sensor.
#   Available options are 'max', 'min', 'mean'.
maximum_deviation: 100
#   Must be provided. Maximum permissible deviation between the sensors
#   to combine (e.g. 5 degrees). To disable it, use a large value (e.g. 999.9)
control: pid
pid_Kp: 61.470837
pid_Ki: 0.5
pid_Kd: 0
pwm_cycle_time: 0.3
min_temp: -273.15
max_temp: 90

[verify_heater chamber]
max_error: 120
check_gain_time: 480
hysteresis: 50
heating_gain: 1